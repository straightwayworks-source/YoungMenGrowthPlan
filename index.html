<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field &amp; Trail — Growth Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Zilla+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--color-bg);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
    font-family: var(--font-body);
    color: var(--color-ink);
    min-height: 100vh;
    padding: 0 0 60px;
  }
  .shell { max-width: 780px; margin: 0 auto; padding: 0 14px; }
  h1,h2,h3,h4 { font-family: var(--font-heading); font-weight: 400; letter-spacing: var(--heading-spacing); text-transform: var(--heading-transform); margin: 0; }
  button { font-family: var(--font-body); cursor: pointer; }

  @keyframes riseIn { from { opacity:0; transform:translateY(12px);} to {opacity:1; transform:translateY(0);} }
  .riser { opacity: 0; animation: riseIn .45s ease-out forwards; }

  /* ---------- HEADER ---------- */
  .masthead {
    background: var(--color-primary);
    background-image: radial-gradient(circle at 88% -30%, rgba(255,255,255,.09), transparent 55%);
    color: var(--color-on-primary);
    border-bottom: 3px solid var(--color-accent);
    position: relative; overflow: hidden;
  }
  .masthead-inner { max-width: 780px; margin: 0 auto; padding: 20px 14px 16px; position: relative; z-index: 1; }
  .watermark { position: absolute; right: -50px; top: -60px; width: 220px; height: 220px; opacity: .07; }
  .brandline { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .brandline svg { width: 17px; height: 17px; color: var(--color-accent-light); animation: needle .8s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes needle { from { transform: rotate(-40deg); opacity:0 } to { transform: rotate(0); opacity:1 } }
  .brandline span { font-family: var(--font-heading); font-size: 15px; letter-spacing: 4px; color: var(--color-accent-light); }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .head-row h1 { font-size: 32px; line-height: 1; }
  .head-row h1 input {
    font-family: var(--font-heading); font-size: 32px; letter-spacing: var(--heading-spacing);
    text-transform: var(--heading-transform); background: transparent; border: none;
    border-bottom: 1px dashed rgba(255,255,255,.3); color: var(--color-on-primary);
    padding: 0 2px; width: 260px; outline: none;
  }
  .head-row h1 input:focus { border-bottom-color: var(--color-accent-light); }
  .stat-cluster { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    border-radius: var(--radius); padding: 6px 11px; text-align: center; min-width: 74px;
  }
  .stat .k { display:block; font-family: var(--font-heading); font-size: 19px; color: var(--color-accent-light); line-height:1.1; }
  .stat .l { display:block; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.6); margin-top:2px; }

  /* ---------- SMALL PHONES (iPhone SE/XS/13 mini width and down) ---------- */
  @media (max-width: 400px) {
    .head-row h1, .head-row h1 input { font-size: 25px; }
    .head-row h1 input { width: 150px; }
    .stat { min-width: 64px; padding: 5px 8px; }
    .stat .k { font-size: 16px; }
    .today-date { font-size: 15px; }
    .today-date .qday { font-size: 10.5px; }
    .qcard, .bico { min-width: 0; }
  }

  /* ---------- NAV ---------- */
  nav { background: var(--color-primary-dark); position: sticky; top: 0; z-index: 20; }
  .nav-inner { max-width: 780px; margin: 0 auto; padding: 0 14px; display: flex; gap: 2px; overflow-x: auto; }
  .nav-inner button {
    background: transparent; border: none; border-bottom: 3px solid transparent;
    color: rgba(255,255,255,.55); font-family: var(--font-heading); font-size: 14px;
    letter-spacing: 1.2px; text-transform: uppercase; padding: 12px 13px; white-space: nowrap;
    transition: color .18s, border-color .18s;
  }
  .nav-inner button:hover { color: var(--color-accent-light); }
  .nav-inner button.on { color: var(--color-accent-light); border-bottom-color: var(--color-accent); }

  /* ---------- CARDS / SHARED ---------- */
  .view { display: none; padding-top: 20px; }
  .view.on { display: block; }
  .card {
    background: var(--color-surface); border: 1px solid var(--color-primary-soft);
    border-radius: var(--radius-lg); padding: 18px 18px 16px; margin-bottom: 14px;
  }
  .card.accent { border-left: 5px solid var(--color-accent); }
  .sec-title {
    font-family: var(--font-heading); font-size: 17px; color: var(--color-primary);
    letter-spacing: var(--heading-spacing); text-transform: var(--heading-transform);
    margin: 0 0 12px; display: flex; align-items: center; gap: 9px;
  }
  .sec-title::after { content:""; flex:1; height:1px; background: repeating-linear-gradient(90deg, var(--color-primary) 0 4px, transparent 4px 8px); opacity:.4; }
  .sec-title svg { width: 17px; height: 17px; color: var(--color-accent); flex-shrink: 0; }
  .muted { color: var(--color-ink-soft); font-size: 13.5px; line-height: 1.6; }

  /* ---------- TASKS ---------- */
  .task {
    display: flex; align-items: center; gap: 12px; background: var(--color-surface);
    border: 1px solid var(--color-primary-soft); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px; font-size: 15px; cursor: pointer;
    transition: border-color .18s, transform .12s;
  }
  .task:hover { border-color: var(--color-accent); }
  .task:active { transform: scale(.995); }
  .cbox {
    width: 23px; height: 23px; border: 2px solid var(--color-primary); border-radius: 3px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background .2s;
  }
  .cbox svg { width: 14px; height: 14px; color: var(--color-on-primary); opacity: 0; transform: scale(.3) rotate(-25deg); transition: transform .28s cubic-bezier(.2,1.7,.4,1), opacity .15s; }
  .task.done .cbox { background: var(--color-primary); }
  .task.done .cbox svg { opacity: 1; transform: scale(1) rotate(0); }
  .task.done .tlabel { text-decoration: line-through; color: var(--color-ink-soft); }
  .tlabel { flex: 1; }
  .tarea { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--color-ink-faint); font-weight: 600; }

  /* ---------- PROGRESS ---------- */
  .ptrack { height: 11px; background: var(--color-surface-deep); border-radius: 6px; overflow: hidden; border: 1px solid var(--color-primary-soft); }
  .pfill { height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); transition: transform 1s cubic-bezier(.3,.85,.3,1);
    background: repeating-linear-gradient(115deg, var(--color-accent) 0 8px, var(--color-accent-light) 8px 16px); }
  .plabel { display:flex; justify-content: space-between; font-family: var(--font-heading); font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--color-primary); margin-bottom: 7px; }
  .today-date {
    display: flex; align-items: center; gap: 9px; margin: 2px 0 14px;
    font-family: var(--font-heading); font-size: 18px; letter-spacing: 1px;
    text-transform: var(--heading-transform); color: var(--color-primary);
  }
  .today-date svg { width: 16px; height: 16px; color: var(--color-accent); flex-shrink: 0; }
  .today-date .qday { font-family: var(--font-body); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--color-ink-soft); margin-left: auto; }

  /* ---------- VERSE / QUOTE ---------- */
  .verse, .quote { border-radius: var(--radius); padding: 15px 17px; margin-bottom: 12px; line-height: 1.65; font-size: 15px; }
  .verse { background: var(--color-surface-alt); font-style: italic; }
  .verse cite, .quote cite { display: block; margin-top: 9px; font-style: normal; font-family: var(--font-heading); font-size: 12.5px; letter-spacing: 1px; color: var(--color-primary); }
  .quote { background: var(--color-surface); border-left: 4px solid var(--color-accent-light); font-size: 14.5px; }
  .verse svg, .quote svg { width: 16px; height: 16px; color: var(--color-accent); margin-bottom: 5px; display: block; }

  /* ---------- OPTIONS / RADIO ---------- */
  .opt {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; margin-bottom: 7px;
    background: var(--color-surface-alt); border: 1px solid transparent; border-radius: var(--radius);
    font-size: 14px; cursor: pointer; transition: border-color .18s, background .18s;
  }
  .opt:hover { border-color: var(--color-accent-light); }
  .opt.sel { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--color-primary); flex-shrink: 0; margin-top: 2px; position: relative; }
  .opt.sel .dot::after { content:""; position:absolute; inset: 2px; border-radius: 50%; background: var(--color-accent); animation: pop .25s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop { from { transform: scale(0) } to { transform: scale(1) } }

  textarea {
    width: 100%; min-height: 110px; font-family: var(--font-body); font-size: 14.5px; line-height: 1.7;
    color: var(--color-ink); background: var(--color-surface-alt); border: 1px solid var(--color-primary-soft);
    border-radius: var(--radius); padding: 12px 14px; resize: vertical; outline: none;
    background-image: repeating-linear-gradient(transparent 0 calc(1.7em - 1px), var(--color-primary-soft) calc(1.7em - 1px) 1.7em);
    background-attachment: local; line-height: 1.7;
  }
  textarea:focus { border-color: var(--color-accent); }

  .btn {
    font-size: 13.5px; font-weight: 600; background: var(--color-primary); color: var(--color-on-primary);
    border: none; border-radius: var(--radius); padding: 10px 16px; display: inline-flex; align-items: center; gap: 7px;
    transition: transform .12s, filter .18s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 14px; height: 14px; }
  .btn.ghost { background: var(--color-surface); color: var(--color-ink); border: 1px solid var(--color-primary-soft); }
  .btn.ghost:hover { border-color: var(--color-primary); }
  .btn.acc { background: var(--color-accent); color: var(--color-on-accent); }
  .btn.danger { background: var(--color-danger); color: #fff; }
  .btn.sm { padding: 7px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------- WEEK NAV ---------- */
  .weekbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 16px; }
  .wchip {
    width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--color-primary-soft);
    background: var(--color-surface); font-family: var(--font-heading); font-size: 14px; color: var(--color-ink-soft);
    display: flex; align-items: center; justify-content: center; transition: all .18s;
  }
  .wchip:hover { border-color: var(--color-accent); }
  .wchip.on { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
  .wchip.complete { border-color: var(--color-success); color: var(--color-success); }
  .wchip.complete.on { background: var(--color-success); color: #fff; }

  /* ---------- QUESTS ---------- */
  .qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 11px; }
  .qcard {
    background: var(--color-surface); border: 1px solid var(--color-primary-soft); border-radius: var(--radius-lg);
    padding: 15px; cursor: pointer; transition: border-color .18s, transform .15s;
  }
  .qcard:hover { border-color: var(--color-accent); transform: translateY(-2px); }
  .qcard.sel { border: 2px solid var(--color-accent); background: var(--color-accent-soft); }
  .qcard .qicon { width: 40px; height: 40px; border-radius: 50%; background: var(--color-primary); display:flex; align-items:center; justify-content:center; margin-bottom: 10px; }
  .qcard .qicon svg { width: 20px; height: 20px; color: var(--color-on-primary); }
  .qcard h4 { font-size: 16px; color: var(--color-primary); margin-bottom: 6px; }
  .qcard p { font-size: 13px; line-height: 1.55; margin: 0; color: var(--color-ink-soft); }
  .mstone { display:flex; align-items:center; gap:10px; padding: 10px 12px; background: var(--color-surface-alt); border-radius: var(--radius); margin-bottom: 7px; font-size: 14px; cursor: pointer; }
  .mstone .cbox { width: 20px; height: 20px; }

  /* ---------- BADGES ---------- */
  .bgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px,1fr)); gap: 13px; }
  .badge { text-align: center; }
  .bico {
    width: 62px; height: 62px; margin: 0 auto 8px; border-radius: 50%; background: var(--color-primary);
    border: 2px solid var(--color-accent-light); display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .bico svg { width: 27px; height: 27px; color: var(--color-on-primary); z-index: 1; }
  .bico::after {
    content:""; position:absolute; top:0; left:-60%; width:42%; height:100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,.5), transparent);
    animation: sheen 3.4s ease-in-out infinite;
  }
  @keyframes sheen { 0%{left:-60%} 32%{left:135%} 100%{left:135%} }
  .badge.locked .bico { background: transparent; border: 2px dashed var(--color-locked); }
  .badge.locked .bico::after { display: none; }
  .badge.locked .bico svg { color: var(--color-locked); width: 20px; height: 20px; }
  .bname { font-family: var(--font-heading); font-size: 12px; letter-spacing: .5px; color: var(--color-ink); }
  .breq { font-size: 10.5px; color: var(--color-ink-faint); line-height:1.4; margin-top: 3px; }
  .badge.locked .bname { color: var(--color-locked); }

  /* ---------- PRIVILEGES ---------- */
  .privpanel { background: var(--color-primary-dark); border-radius: var(--radius-lg); padding: 18px; color: var(--color-on-primary); }
  .privpanel h3 { color: var(--color-accent-light); font-size: 17px; display:flex; align-items:center; gap:8px; }
  .privpanel h3 svg { width: 17px; height: 17px; }
  .prow {
    display:flex; align-items:center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: rgba(255,255,255,.055); border-radius: var(--radius); padding: 12px 13px; margin-bottom: 8px;
  }
  .prow .pname { font-size: 14px; flex: 1; min-width: 170px; }
  .prow .psub { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 3px; }
  .pill { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; font-weight: 700; }
  .pill.low { background: rgba(120,200,140,.18); color: var(--color-status-good); }
  .pill.medium { background: rgba(227,161,92,.2); color: var(--color-accent-light); }
  .pill.high { background: rgba(220,120,110,.2); color: var(--color-status-warn); }
  .pill.granted { background: rgba(120,200,140,.22); color: var(--color-status-good); }
  .pill.revoked { background: rgba(220,90,80,.22); color: var(--color-status-bad); }
  .pill.eligible { background: rgba(227,161,92,.22); color: var(--color-accent-light); }
  .pill.locked2 { background: rgba(255,255,255,.08); color: rgba(255,255,255,.45); }
  .pactions { display: flex; gap: 6px; }
  .pactions button { font-size: 11.5px; padding: 5px 10px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: rgba(255,255,255,.85); }
  .pactions button:hover { border-color: var(--color-accent-light); color: var(--color-accent-light); }
  .locknote { display:flex; align-items:center; gap:10px; font-size: 13px; color: rgba(255,255,255,.6); padding: 16px 0 4px; }
  .pinbox { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; margin-top: 12px; }
  .pinbox input {
    font-family: var(--font-heading); font-size: 18px; letter-spacing: 8px; width: 120px; text-align: center;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.25); color: var(--color-on-primary);
    border-radius: var(--radius); padding: 8px 10px; outline: none;
  }
  .pinbox input:focus { border-color: var(--color-accent-light); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .shake { animation: shake .35s; }
  .revoked-row { opacity: .72; }
  .reason { font-size: 11.5px; color: var(--color-status-bad); margin-top: 5px; width: 100%; }
  .restore { font-size: 11.5px; color: rgba(255,255,255,.55); margin-top: 4px; width: 100%; }

  /* ---------- TOASTS / CELEBRATION ---------- */
  #toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; display:flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast {
    background: var(--color-primary); color: var(--color-on-primary); border-left: 4px solid var(--color-accent);
    border-radius: var(--radius); padding: 12px 18px; font-size: 14px; display:flex; align-items:center; gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28); animation: toastIn .4s cubic-bezier(.2,1.5,.4,1);
    max-width: 420px;
  }
  .toast svg { width: 18px; height: 18px; color: var(--color-accent-light); flex-shrink: 0; }
  .toast strong { font-family: var(--font-heading); letter-spacing: 1px; }
  @keyframes toastIn { from { opacity:0; transform: translateY(24px) scale(.94) } to { opacity:1; transform: translateY(0) scale(1) } }
  .toast.out { animation: toastOut .35s forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateY(14px) scale(.96) } }

  .spark { position: fixed; width: 8px; height: 8px; border-radius: 2px; z-index: 199; pointer-events: none; }

  .footer-strip { display:flex; align-items:center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12.5px; color: var(--color-ink-soft); }
  #fileIn { display: none; }
  .saved-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-success); display:inline-block; margin-right: 6px; }
</style>
</head>
<body>

<header class="masthead">
  <svg class="watermark" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="22"/><path d="M50 2v96M2 50h96M22 22l56 56M78 22L22 78"/></svg>
  <div class="masthead-inner">
    <div class="brandline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-4.2 2.3-2.3 4.2 4.2-2.3z"/></svg>
      <span>Field &amp; Trail</span>
    </div>
    <div class="head-row">
      <h1><input id="nameIn" placeholder="Your name" maxlength="18" aria-label="Your name"></h1>
      <div class="stat-cluster">
        <div class="stat"><span class="k" id="sRank">—</span><span class="l">Rank</span></div>
        <div class="stat"><span class="k" id="sPts">0</span><span class="l">Points</span></div>
        <div class="stat"><span class="k" id="sStreak">0</span><span class="l">Streak</span></div>
        <div class="stat"><span class="k" id="sBadges">0</span><span class="l">Badges</span></div>
      </div>
    </div>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <button data-v="today" class="on">Today</button>
    <button data-v="week">Week</button>
    <button data-v="quest">Quest</button>
    <button data-v="badges">Badges</button>
    <button data-v="priv">Privileges</button>
    <button data-v="men">Mentor</button>
  </div>
</nav>

<div class="shell">

  <!-- TODAY -->
  <div class="view on" id="v-today">
    <div class="card riser">
      <div class="plabel"><span>Rank progress</span><span id="rankNext">—</span></div>
      <div class="ptrack"><div class="pfill" id="rankFill"></div></div>
      <p class="muted" style="margin:9px 0 0" id="streakLine"></p>
    </div>
    <p class="today-date riser" id="todayDate" style="animation-delay:.02s"></p>
    <h2 class="sec-title riser" style="animation-delay:.05s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V9M12 9c0-3 2-5 5-5 0 3-2 5-5 5zM12 12c0-3-2-5-5-5 0 3 2 5 5 5z"/></svg>
      Today's roots
    </h2>
    <div id="rootList"></div>
    <div class="card riser" id="todayVerseCard" style="animation-delay:.1s"></div>
  </div>

  <!-- WEEK -->
  <div class="view" id="v-week">
    <div class="weekbar" id="weekBar"></div>
    <div id="weekBody"></div>
  </div>

  <!-- QUEST -->
  <div class="view" id="v-quest">
    <div id="questBody"></div>
  </div>

  <!-- BADGES -->
  <div class="view" id="v-badges">
    <h2 class="sec-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.8 6.3L21.5 9l-4.8 4.4 1.4 7.1L12 17l-6.1 3.5 1.4-7.1L2.5 9l6.7-.7z"/></svg>Badge shelf</h2>
    <div class="card"><div class="bgrid" id="badgeGrid"></div></div>
  </div>

  <!-- PRIVILEGES -->
  <div class="view" id="v-priv">
    <div class="privpanel" id="privPanel"></div>
    <p class="muted" style="margin-top:12px">Points make a privilege <em>eligible</em>. The mentor decides whether it's granted. Every grant and revoke is logged with a reason.</p>
  </div>

  <!-- MENTOR -->
  <div class="view" id="v-men">
    <div id="mentorBody"></div>
  </div>

  <div class="footer-strip">
    <span><span class="saved-dot"></span><span id="savedAt">Saved on this device</span></span>
    <span style="display:flex; gap:8px">
      <button class="btn ghost sm" onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Export progress</button>
      <button class="btn ghost sm" onclick="document.getElementById('fileIn').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0L8 13m4-4l4 4M4 3h16"/></svg>Load backup</button>
      <input type="file" id="fileIn" accept="application/json">
    </span>
  </div>
</div>

<div id="toasts"></div>

<script src="content_q1_tier1.js"></script>
<script>
/* ============================================================
   ICONS
   ============================================================ */
const ICO = {
  book:'<path d="M4 4h7a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2.5H4z"/><path d="M20 4h-2a3 3 0 00-3 3v13a2.5 2.5 0 012.5-2.5H20z"/>',
  droplet:'<path d="M12 3s6 6.5 6 10a6 6 0 01-12 0c0-3.5 6-10 6-10z"/>',
  bed:'<path d="M3 18v-7h13a4 4 0 014 4v3M3 11V7M3 18h18"/><circle cx="7.5" cy="13.5" r="1.5"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  message:'<path d="M20 15a3 3 0 01-3 3H8l-4 3V6a3 3 0 013-3h10a3 3 0 013 3z"/>',
  activity:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  screen:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  heart:'<path d="M12 20s-7-4.5-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.5-7 9-7 9z"/>',
  flame:'<path d="M12 2c-1.2 3.4-4.5 4.6-4.5 9a4.5 4.5 0 009 0c0-4.4-3.3-5.6-4.5-9z"/>',
  hammer:'<path d="M14 6l4 4M3 21l9-9M12 4l6 6-3 3-6-6z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  hands:'<path d="M6 12V6a2 2 0 014 0v6M10 11V4a2 2 0 014 0v7M14 11V6a2 2 0 014 0v9a6 6 0 01-6 6h-2a6 6 0 01-6-6v-3"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  tree:'<path d="M12 22v-6M12 16l-5-4h3l-4-4h3L12 3l3 5h3l-4 4h3z"/>',
  arrow:'<path d="M3 21L21 3M21 3h-7M21 3v7"/>',
  wrench:'<path d="M15 6a4 4 0 01-5.3 5.3L4 17.5V20h2.5l6.2-5.7A4 4 0 0118 9l-2-2 1-1z"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 010 3.6h-3a1.8 1.8 0 000 3.6h4"/>',
  cross:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M12 10v5M9.5 12.5h5M9 6V4h6v2"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-4.2 2.3-2.3 4.2 4.2-2.3z"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/>',
  star:'<path d="M12 2l2.8 6.3L21.5 9l-4.8 4.4 1.4 7.1L12 17l-6.1 3.5 1.4-7.1L2.5 9l6.7-.7z"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="1.8"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  unlock:'<rect x="5" y="11" width="14" height="9" rx="1.8"/><path d="M8 11V8a4 4 0 017.5-2"/>',
  quote:'<path d="M9 7H5v5h4c0 2.5-1 4-3 5M19 7h-4v5h4c0 2.5-1 4-3 5"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0M17 11a3 3 0 100-6M18 20a5 5 0 00-2-4"/>'
};
const svg = (n, cls) => '<svg ' + (cls?'class="'+cls+'" ':'') + 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICO[n]||ICO.star) + '</svg>';

/* ============================================================
   STATE
   ============================================================ */
const KEY = "ymgp_q1_t1_v1";
const todayKey = () => new Date().toISOString().slice(0,10);

const blank = () => ({
  name: "",
  roots: {},          // "YYYY-MM-DD": ["dr1","dr3"]
  weeks: {},          // n: { appDone, optIdx, journal, mentorDone }
  quest: { id:null, milestones:[] },
  badges: [],
  privileges: {},     // id: { status, reason, at }
  pin: null,
  lastSaved: null
});
let S = load();
let curWeek = 1;

function load() {
  try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch(e){}
  return blank();
}
function save() {
  S.lastSaved = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  const el = document.getElementById('savedAt');
  if (el) el.textContent = "Saved " + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}

/* ============================================================
   SCORING
   ============================================================ */
function totalPoints() {
  let p = 0;
  Object.values(S.roots).forEach(list => p += list.length * PLAN.points.dailyRoot);
  Object.values(S.weeks).forEach(w => {
    if (w.appDone) p += PLAN.points.weeklyApplication;
    if (w.journal && w.journal.trim().length > 30) p += PLAN.points.weeklyReflection;
    if (w.mentorDone) p += PLAN.points.mentorConversation;
  });
  const q = S.quest;
  if (q.id) {
    p += q.milestones.filter(Boolean).length * PLAN.points.questMilestone;
    const def = PLAN.quests.find(x => x.id === q.id);
    if (def && q.milestones.filter(Boolean).length >= def.milestones.length) p += PLAN.points.questComplete;
  }
  return p;
}
function rankFor(p) {
  let r = PLAN.ranks[0];
  PLAN.ranks.forEach(x => { if (p >= x.minPoints) r = x; });
  return r;
}
function nextRank(p) { return PLAN.ranks.find(x => x.minPoints > p) || null; }

function streak() {
  // Today counts only once it's complete. An unfinished today is "pending",
  // not "broken" — otherwise the streak would read 0 every morning.
  let n = 0;
  const d = new Date();
  for (let i = 0; i < 400; i++) {
    const k = d.toISOString().slice(0,10);
    const done = (S.roots[k] || []).length;
    if (done >= PLAN.dailyRoots.length) n++;
    else if (i > 0) break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function weekComplete(n) {
  const w = S.weeks[n];
  return !!(w && w.appDone && w.journal && w.journal.trim().length > 30);
}

/* ============================================================
   FEEDBACK
   ============================================================ */
function toast(title, msg, icon) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = svg(icon || 'star') + '<span><strong>' + title + '</strong><br>' + msg + '</span>';
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 3600);
}
function sparks(x, y) {
  const cols = ['var(--color-accent)','var(--color-accent-light)','var(--color-primary)'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.background = cols[i % 3];
    document.body.appendChild(s);
    const ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.5;
    const dist = 45 + Math.random() * 70;
    s.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + Math.cos(ang)*dist + 'px,' + (Math.sin(ang)*dist + 40) + 'px) scale(.2) rotate(220deg)', opacity: 0 }
    ], { duration: 750 + Math.random()*350, easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => s.remove();
  }
}

/* ============================================================
   BADGE AWARDING
   ============================================================ */
function checkBadges() {
  const has = id => S.badges.includes(id);
  const give = (id) => {
    if (has(id)) return;
    S.badges.push(id);
    const b = PLAN.badges.find(x => x.id === id);
    toast('Badge earned', b ? b.name : id, 'star');
    const r = document.body.getBoundingClientRect();
    sparks(r.width/2, window.innerHeight * 0.5);
  };
  // Rooted: 14 consecutive full days
  if (streak() >= 14) give('b_root');
  const w = n => S.weeks[n] || {};
  if (w(2).appDone) give('b_truth');
  if (w(3).appDone) give('b_tools');
  if (w(6).appDone) give('b_money');
  if (w(7).appDone) give('b_aid');
  if (w(9).appDone) give('b_nav');
  if (w(10).appDone) give('b_stand');
  if (w(11).appDone) give('b_fixer');
  // Quest badge
  const q = S.quest;
  if (q.id) {
    const def = PLAN.quests.find(x => x.id === q.id);
    if (def && q.milestones.filter(Boolean).length >= def.milestones.length) {
      const bid = 'qb_' + q.id;
      if (!S.badges.includes(bid)) { S.badges.push(bid); toast('Quest complete', def.badge + ' badge earned', 'star'); }
    }
  }
  // Quarter done requires all 13 weeks + mentor cosign
  let all = true;
  for (let i = 1; i <= 13; i++) if (!weekComplete(i)) all = false;
  if (all && S.mentorCosign) give('b_quarter');
}

/* ============================================================
   RENDER — HEADER
   ============================================================ */
let lastRank = null;
function renderHead() {
  const p = totalPoints(), r = rankFor(p), nx = nextRank(p);
  document.getElementById('sPts').textContent = p;
  document.getElementById('sRank').textContent = r.name;
  document.getElementById('sStreak').textContent = streak();
  document.getElementById('sBadges').textContent = S.badges.length;
  document.getElementById('rankNext').textContent = nx ? (p + ' / ' + nx.minPoints + ' to ' + nx.name) : 'Top rank';
  const lo = r.minPoints, hi = nx ? nx.minPoints : Math.max(p,1);
  const pct = nx ? Math.min(1, (p - lo) / Math.max(1, hi - lo)) : 1;
  setTimeout(() => { document.getElementById('rankFill').style.transform = 'scaleX(' + pct.toFixed(3) + ')'; }, 60);
  document.getElementById('streakLine').textContent = r.note + (streak() ? '  ·  ' + streak() + ' day streak' : '');
  if (lastRank && lastRank !== r.name) { toast('Rank up', 'You are now ' + r.name, 'shield'); sparks(window.innerWidth/2, 140); }
  lastRank = r.name;
}

/* ============================================================
   RENDER — TODAY
   ============================================================ */
function renderToday() {
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('todayDate').innerHTML =
    svg('compass') + dateStr + '<span class="qday">Week ' + Math.min(curWeek, 13) + ' of ' + PLAN.meta.weeks + '</span>';

  const k = todayKey();
  const done = S.roots[k] || [];
  document.getElementById('rootList').innerHTML = PLAN.dailyRoots.map((r,i) =>
    '<div class="task' + (done.includes(r.id) ? ' done' : '') + '" data-root="' + r.id + '" style="animation-delay:' + (i*0.03) + 's">' +
      '<span class="cbox">' + svg('check') + '</span>' +
      '<span class="tlabel">' + r.text + '<br><span class="tarea">' + r.area + '</span></span>' +
    '</div>').join('');

  const wk = PLAN.weeks[Math.min(curWeek, 13) - 1];
  document.getElementById('todayVerseCard').innerHTML =
    '<h2 class="sec-title">' + svg('book') + 'Week ' + wk.n + ' — ' + wk.theme + '</h2>' +
    '<div class="verse">' + svg('compass') + '"' + wk.verse.text + '"<cite>' + wk.verse.ref + '</cite></div>' +
    '<div class="quote">' + svg('quote') + wk.quote.text + '<cite>— ' + wk.quote.by + '</cite></div>';
}
document.getElementById('rootList').addEventListener('click', e => {
  const el = e.target.closest('[data-root]'); if (!el) return;
  const k = todayKey(), id = el.dataset.root;
  if (!S.roots[k]) S.roots[k] = [];
  const i = S.roots[k].indexOf(id);
  if (i >= 0) { S.roots[k].splice(i,1); el.classList.remove('done'); }
  else {
    S.roots[k].push(id); el.classList.add('done');
    const b = el.getBoundingClientRect();
    if (S.roots[k].length === PLAN.dailyRoots.length) {
      toast('Roots complete', 'All eight, done today. Streak: ' + (streak()) + ' days', 'tree');
      sparks(b.left + b.width/2, b.top);
    }
  }
  save(); checkBadges(); renderHead();
});

/* ============================================================
   RENDER — WEEK
   ============================================================ */
function renderWeekBar() {
  document.getElementById('weekBar').innerHTML = PLAN.weeks.map(w =>
    '<button class="wchip' + (w.n===curWeek?' on':'') + (weekComplete(w.n)?' complete':'') + '" data-wk="' + w.n + '">' + w.n + '</button>').join('');
}
function renderWeek() {
  const w = PLAN.weeks[curWeek-1];
  const st = S.weeks[curWeek] || {};
  document.getElementById('weekBody').innerHTML =
    '<div class="card riser">' +
      '<h2 class="sec-title">' + svg('compass') + 'Week ' + w.n + ' — ' + w.theme + '</h2>' +
      '<div class="verse">' + svg('book') + '"' + w.verse.text + '"<cite>' + w.verse.ref + '</cite></div>' +
      '<div class="quote">' + svg('quote') + w.quote.text + '<cite>— ' + w.quote.by + '</cite></div>' +
    '</div>' +
    '<div class="card accent riser" style="animation-delay:.05s">' +
      '<h2 class="sec-title">' + svg('target') + w.application.title + '</h2>' +
      '<p class="muted" style="margin:0 0 13px">' + w.application.text + '</p>' +
      '<p class="muted" style="font-size:12px; letter-spacing:1px; text-transform:uppercase; margin:0 0 8px">Pick your approach</p>' +
      w.application.options.map((o,i) =>
        '<div class="opt' + (st.optIdx===i?' sel':'') + '" data-opt="' + i + '"><span class="dot"></span><span>' + o + '</span></div>').join('') +
      '<div style="margin-top:13px">' +
        '<button class="btn ' + (st.appDone?'ghost':'acc') + '" id="appBtn">' + svg('check') + (st.appDone ? 'Completed — undo' : 'Mark this done') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="card riser" style="animation-delay:.1s">' +
      '<h2 class="sec-title">' + svg('book') + 'Journal</h2>' +
      '<p class="muted" style="margin:0 0 11px">' + w.journal + '</p>' +
      '<textarea id="jrn" placeholder="Write it out. Nobody reads this but you and whoever you show it to.">' + (st.journal||'') + '</textarea>' +
    '</div>';
  renderWeekBar();
}
document.getElementById('weekBar').addEventListener('click', e => {
  const b = e.target.closest('[data-wk]'); if (!b) return;
  curWeek = +b.dataset.wk; renderWeek(); renderToday();
});
document.getElementById('weekBody').addEventListener('click', e => {
  const o = e.target.closest('[data-opt]');
  if (o) {
    if (!S.weeks[curWeek]) S.weeks[curWeek] = {};
    S.weeks[curWeek].optIdx = +o.dataset.opt;
    save(); renderWeek(); return;
  }
  if (e.target.closest('#appBtn')) {
    if (!S.weeks[curWeek]) S.weeks[curWeek] = {};
    const now = !S.weeks[curWeek].appDone;
    S.weeks[curWeek].appDone = now;
    if (now) {
      const r = e.target.getBoundingClientRect();
      sparks(r.left + r.width/2, r.top);
      toast('Challenge done', 'Week ' + curWeek + ' — ' + PLAN.weeks[curWeek-1].application.title, 'target');
    }
    save(); checkBadges(); renderHead(); renderWeek();
  }
});
document.getElementById('weekBody').addEventListener('input', e => {
  if (e.target.id === 'jrn') {
    if (!S.weeks[curWeek]) S.weeks[curWeek] = {};
    S.weeks[curWeek].journal = e.target.value;
    clearTimeout(window._jt);
    window._jt = setTimeout(() => { save(); renderHead(); renderWeekBar(); }, 600);
  }
});

/* ============================================================
   RENDER — QUEST
   ============================================================ */
function renderQuest() {
  const body = document.getElementById('questBody');
  if (!S.quest.id) {
    body.innerHTML =
      '<div class="card riser"><h2 class="sec-title">' + svg('target') + 'Choose your quest</h2>' +
      '<p class="muted" style="margin:0 0 15px">One quest for the whole quarter. Pick the one that stretches you, not the easy one. You work it from week 3 through week 11.</p>' +
      '<div class="qgrid">' + PLAN.quests.map(q =>
        '<div class="qcard" data-q="' + q.id + '"><div class="qicon">' + svg(q.icon) + '</div>' +
        '<h4>' + q.name + '</h4><p>' + q.blurb + '</p></div>').join('') + '</div></div>';
    return;
  }
  const def = PLAN.quests.find(x => x.id === S.quest.id);
  const doneN = S.quest.milestones.filter(Boolean).length;
  const pct = doneN / def.milestones.length;
  body.innerHTML =
    '<div class="card accent riser">' +
      '<h2 class="sec-title">' + svg(def.icon) + def.name + '</h2>' +
      '<p class="muted" style="margin:0 0 14px">' + def.blurb + '</p>' +
      '<div class="plabel"><span>Quest progress</span><span>' + doneN + ' / ' + def.milestones.length + '</span></div>' +
      '<div class="ptrack"><div class="pfill" id="qFill"></div></div>' +
      '<div style="margin-top:15px">' + def.milestones.map((m,i) =>
        '<div class="mstone" data-ms="' + i + '"><span class="cbox' + (S.quest.milestones[i]?' x':'') + '" style="' + (S.quest.milestones[i]?'background:var(--color-primary)':'') + '">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:12px;height:12px;color:var(--color-on-primary);opacity:' + (S.quest.milestones[i]?1:0) + '"><path d="M4 12l5 5L20 6"/></svg>' +
        '</span><span>' + m + '</span></div>').join('') + '</div>' +
      (doneN >= def.milestones.length ? '<p class="muted" style="margin-top:12px; color:var(--color-success); font-weight:600">Quest complete — ' + def.badge + ' badge earned.</p>' : '') +
      '<div style="margin-top:14px"><button class="btn ghost sm" id="qReset">Change quest</button></div>' +
    '</div>';
  setTimeout(() => { const f = document.getElementById('qFill'); if (f) f.style.transform = 'scaleX(' + pct.toFixed(3) + ')'; }, 60);
}
document.getElementById('questBody').addEventListener('click', e => {
  const pick = e.target.closest('[data-q]');
  if (pick) {
    const def = PLAN.quests.find(x => x.id === pick.dataset.q);
    S.quest = { id: pick.dataset.q, milestones: new Array(def.milestones.length).fill(false) };
    save(); renderQuest(); toast('Quest started', def.name, def.icon); return;
  }
  const ms = e.target.closest('[data-ms]');
  if (ms) {
    const i = +ms.dataset.ms;
    S.quest.milestones[i] = !S.quest.milestones[i];
    if (S.quest.milestones[i]) { const r = ms.getBoundingClientRect(); sparks(r.left + 30, r.top + 10); }
    save(); checkBadges(); renderHead(); renderQuest(); return;
  }
  if (e.target.closest('#qReset')) {
    if (confirm('Change quest? Milestone progress on the current quest is cleared.')) {
      S.quest = { id:null, milestones:[] }; save(); renderQuest(); renderHead();
    }
  }
});

/* ============================================================
   RENDER — BADGES
   ============================================================ */
function renderBadges() {
  const questBadges = PLAN.quests.map(q => ({ id:'qb_'+q.id, name:q.badge, icon:q.icon, req:'Complete the "' + q.name + '" quest' }));
  const all = PLAN.badges.concat(questBadges);
  document.getElementById('badgeGrid').innerHTML = all.map(b => {
    const got = S.badges.includes(b.id);
    return '<div class="badge' + (got?'':' locked') + '">' +
      '<div class="bico">' + svg(got ? b.icon : 'lock') + '</div>' +
      '<div class="bname">' + b.name + '</div>' +
      '<div class="breq">' + (got ? 'Earned' : b.req) + '</div></div>';
  }).join('');
}

/* ============================================================
   RENDER — PRIVILEGES (PIN GATED)
   ============================================================ */
let unlocked = false;
let lockTimer = null;
const LOCK_AFTER_MS = 10 * 60 * 1000;   /* auto-lock after 10 minutes of no mentor activity */

function lockAll(silent) {
  unlocked = false;
  clearTimeout(lockTimer);
  renderPriv(); renderMentor();
  if (!silent) toast('Locked', 'Mentor controls locked again.', 'lock');
}
function touchLock() {
  clearTimeout(lockTimer);
  if (unlocked) lockTimer = setTimeout(() => lockAll(false), LOCK_AFTER_MS);
}
function unlockAll() { unlocked = true; touchLock(); renderPriv(); renderMentor(); }

/* Shared lock UI. `sc` scopes the input id so both mentor surfaces can render one. */
function gateHTML(sc, msg) {
  return '<div class="locknote">' + svg('lock') + '<span>' +
      (S.pin ? msg : 'Set a 4-digit mentor PIN. Until you do, this side is open — set it now.') +
    '</span></div>' +
    '<div class="pinbox"><input id="pinIn_' + sc + '" type="password" inputmode="numeric" maxlength="4" placeholder="&bull;&bull;&bull;&bull;">' +
    '<button class="btn acc sm pinGo">' + (S.pin ? 'Unlock' : 'Set PIN') + '</button>' +
    (S.pin ? '<button class="btn ghost sm pinReset" style="background:transparent;color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.2)">Forgot PIN</button>' : '') +
    '</div>';
}
function lockBtnHTML(dark) {
  const style = dark ? 'background:transparent;color:var(--color-accent-light);border-color:rgba(227,161,92,.4)' : '';
  return '<div class="pinbox"><button class="btn ghost sm pinLock" style="' + style + '">' + svg('lock') + 'Lock mentor panel</button></div>';
}
/* One handler for both panels. Returns true when it consumed the click. */
function handleGateClick(e, sc) {
  if (e.target.closest('.pinGo')) {
    const i = document.getElementById('pinIn_' + sc);
    const v = i.value.trim();
    const bad = () => { i.classList.add('shake'); i.value = ''; setTimeout(() => i.classList.remove('shake'), 400); };
    if (!/^\d{4}$/.test(v)) { bad(); return true; }
    if (!S.pin) { S.pin = v; save(); toast('PIN set', 'Mentor side is protected. It re-locks when the app closes.', 'lock'); unlockAll(); }
    else if (S.pin === v) { toast('Unlocked', 'Mentor controls active.', 'unlock'); unlockAll(); }
    else { bad(); }
    return true;
  }
  if (e.target.closest('.pinLock')) { lockAll(true); return true; }
  if (e.target.closest('.pinReset')) {
    if (confirm('Clear the mentor PIN? This wipes the PIN only — privilege history is kept.')) { S.pin = null; save(); lockAll(true); }
    return true;
  }
  return false;
}

function privState(p) {
  const rec = S.privileges[p.id];
  if (rec && rec.status) return rec.status;
  const pts = totalPoints();
  return pts >= p.reqPoints ? 'eligible' : 'locked';
}
function renderPriv() {
  const panel = document.getElementById('privPanel');
  const pts = totalPoints();
  let html = '<h3>' + svg(unlocked ? 'unlock' : 'lock') + 'Mentor privileges</h3>';

  html += '<div style="margin-top:14px">' + PLAN.privileges.map(p => {
    const st = privState(p);
    const rec = S.privileges[p.id] || {};
    const label = st === 'granted' ? 'Granted' : st === 'revoked' ? 'Revoked' : st === 'eligible' ? 'Eligible' : 'Locked';
    const cls = st === 'granted' ? 'granted' : st === 'revoked' ? 'revoked' : st === 'eligible' ? 'eligible' : 'locked2';
    return '<div class="prow' + (st==='revoked'?' revoked-row':'') + '">' +
      '<div class="pname">' + p.name +
        '<div class="psub">' + p.reqPoints + ' pts · ' + p.reqRank + ' · ' + (pts >= p.reqPoints ? 'threshold met' : (p.reqPoints - pts) + ' pts to go') + '</div></div>' +
      '<span class="pill ' + p.risk + '">' + p.risk + '</span>' +
      '<span class="pill ' + cls + '">' + label + '</span>' +
      (unlocked ? '<span class="pactions">' +
          (st !== 'granted' ? '<button data-grant="' + p.id + '">Grant</button>' : '') +
          (st === 'granted' ? '<button data-revoke="' + p.id + '">Revoke</button>' : '') +
        '</span>' : '') +
      (rec.reason ? '<div class="reason">Revoked: ' + rec.reason + '</div>' : '') +
      (st === 'revoked' ? '<div class="restore">Earn it back: ' + p.restore + '</div>' : '') +
    '</div>';
  }).join('') + '</div>';

  if (!unlocked) { html += gateHTML('priv', 'Enter the mentor PIN to grant or revoke.'); }
  else { html += lockBtnHTML(true); }
  panel.innerHTML = html;
}
document.getElementById('privPanel').addEventListener('click', e => {
  if (handleGateClick(e, 'priv')) return;
  touchLock();
  const g = e.target.closest('[data-grant]');
  if (g && unlocked) {
    const p = PLAN.privileges.find(x => x.id === g.dataset.grant);
    const pts = totalPoints();
    if (pts < p.reqPoints && !confirm('He has not reached the ' + p.reqPoints + '-point threshold for this one (currently ' + pts + '). Grant anyway?')) return;
    S.privileges[p.id] = { status:'granted', at:new Date().toISOString(), reason:null };
    save(); renderPriv(); toast('Privilege granted', p.name, 'unlock'); sparks(window.innerWidth/2, window.innerHeight*0.4);
    return;
  }
  const rv = e.target.closest('[data-revoke]');
  if (rv && unlocked) {
    const p = PLAN.privileges.find(x => x.id === rv.dataset.revoke);
    const why = prompt('Why is this being revoked? (He will see this — name it plainly.)');
    if (why === null) return;
    if (!why.trim()) { alert('A reason is required. Silent revocation breeds resentment.'); return; }
    S.privileges[p.id] = { status:'revoked', at:new Date().toISOString(), reason: why.trim() };
    save(); renderPriv(); toast('Privilege revoked', p.name + ' — restoration path shown', 'lock');
  }
});

/* ============================================================
   RENDER — MENTOR
   ============================================================ */
function renderMentor() {
  const body = document.getElementById('mentorBody');
  if (!unlocked) {
    body.innerHTML = '<div class="privpanel"><h3>' + svg('lock') + 'Mentor only</h3>' +
      '<p style="font-size:14px;line-height:1.6;color:rgba(255,255,255,.72);margin:10px 0 0">' +
        'The week&rsquo;s conversation prompt, the man worth studying, and the quarter co-sign are on this side. ' +
        (S.pin ? 'Enter the PIN to open them.' : 'Set a PIN so this stays yours.') +
      '</p>' + gateHTML('men', 'Enter the mentor PIN to open this.') + '</div>';
    return;
  }
  const w = PLAN.weeks[curWeek-1];
  const st = S.weeks[curWeek] || {};
  const prof = PLAN.profiles[Math.min(2, Math.floor((curWeek-1)/5))];
  body.innerHTML =
    '<div class="card accent riser"><h2 class="sec-title">' + svg('users') + 'Week ' + w.n + ' conversation</h2>' +
      '<p class="muted" style="margin:0 0 14px; font-size:15px">' + w.mentor + '</p>' +
      '<button class="btn ' + (st.mentorDone?'ghost':'acc') + '" id="menBtn">' + svg('check') + (st.mentorDone ? 'Had it — undo' : 'We had this conversation') + '</button>' +
    '</div>' +
    '<div class="card riser" style="animation-delay:.05s"><h2 class="sec-title">' + svg('shield') + prof.name + '</h2>' +
      '<p class="muted" style="margin:0 0 12px; font-size:15px">' + prof.blurb + '</p>' +
      '<div class="quote">' + svg('quote') + prof.takeaway + '<cite>' + prof.ref + '</cite></div>' +
    '</div>' +
    '<div class="card riser" style="animation-delay:.1s"><h2 class="sec-title">' + svg('star') + 'Quarter co-sign</h2>' +
      '<p class="muted" style="margin:0 0 13px">Sign off only when all thirteen weeks are done. Say one specific thing you have seen grow in him — "you did great" means nothing.</p>' +
      '<textarea id="cosign" placeholder="What I have seen grow in you this quarter...">' + (S.cosignNote||'') + '</textarea>' +
      '<div style="margin-top:12px"><button class="btn ' + (S.mentorCosign?'ghost':'acc') + '" id="cosignBtn">' + svg('check') + (S.mentorCosign ? 'Signed — undo' : 'Sign off on the quarter') + '</button></div>' +
    '</div>' +
    lockBtnHTML(false);
}
document.getElementById('mentorBody').addEventListener('click', e => {
  if (handleGateClick(e, 'men')) return;
  touchLock();
  if (e.target.closest('#menBtn')) {
    if (!S.weeks[curWeek]) S.weeks[curWeek] = {};
    S.weeks[curWeek].mentorDone = !S.weeks[curWeek].mentorDone;
    save(); renderHead(); renderMentor(); return;
  }
  if (e.target.closest('#cosignBtn')) {
    S.mentorCosign = !S.mentorCosign;
    if (S.mentorCosign) { toast('Quarter signed', 'Co-signed by mentor', 'star'); sparks(window.innerWidth/2, window.innerHeight*0.45); }
    save(); checkBadges(); renderHead(); renderMentor();
  }
});
document.getElementById('mentorBody').addEventListener('input', e => {
  if (e.target.id === 'cosign') { touchLock(); S.cosignNote = e.target.value; clearTimeout(window._ct); window._ct = setTimeout(save, 600); }
});

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
function exportJSON() {
  const out = {
    _format: "young-man-growth-plan",
    _version: 1,
    quarter: PLAN.meta.quarter, tier: PLAN.meta.tier,
    exportedAt: new Date().toISOString(),
    summary: { name: S.name, points: totalPoints(), rank: rankFor(totalPoints()).name, streak: streak(), badges: S.badges.length },
    state: S
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (S.name ? S.name.replace(/\s+/g,'_').toLowerCase() : 'growth') + '_q' + PLAN.meta.quarter + '_' + todayKey() + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Exported', 'Progress file downloaded. Keep it somewhere safe.', 'check');
}
document.getElementById('fileIn').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      const st = d.state || d;
      if (!st || typeof st !== 'object') throw 0;
      if (!confirm('Load this backup? It replaces what is currently on this device.')) return;
      S = Object.assign(blank(), st);
      save(); boot(); toast('Backup loaded', 'Progress restored.', 'check');
    } catch (err) { alert('That file could not be read as a progress backup.'); }
  };
  rd.readAsText(f); ev.target.value = '';
});

/* ============================================================
   NAV + BOOT
   ============================================================ */
document.querySelector('.nav-inner').addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  document.querySelectorAll('.nav-inner button').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('v-' + b.dataset.v).classList.add('on');
  if (b.dataset.v === 'priv') renderPriv();
  if (b.dataset.v === 'badges') renderBadges();
  if (b.dataset.v === 'men') renderMentor();
  if (b.dataset.v === 'quest') renderQuest();
});
document.getElementById('nameIn').addEventListener('input', e => {
  S.name = e.target.value; clearTimeout(window._nt); window._nt = setTimeout(save, 500);
});

function guessWeek() {
  let last = 1;
  for (let i = 1; i <= 13; i++) if (weekComplete(i)) last = Math.min(13, i + 1);
  return last;
}
function boot() {
  document.getElementById('nameIn').value = S.name || '';
  curWeek = guessWeek();
  lastRank = rankFor(totalPoints()).name;
  renderHead(); renderToday(); renderWeek(); renderQuest(); renderBadges(); renderPriv(); renderMentor();
  if (S.lastSaved) document.getElementById('savedAt').textContent = 'Saved ' + new Date(S.lastSaved).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}
boot();
</script>
